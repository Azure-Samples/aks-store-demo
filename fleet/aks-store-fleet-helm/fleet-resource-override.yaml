apiVersion: placement.kubernetes-fleet.io/v1
kind: ResourceOverride
metadata:
  name: aks-store-demo-flux-enable
  namespace: aks-store-demo
spec:
  placement:
    name: aks-store-demo-flux-placement
    scope: Namespaced
  resourceSelectors:
    - group: source.toolkit.fluxcd.io
      version: v1
      kind: HelmRepository
      name: aks-store-demo-source

    - group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: aks-store-demo-rel

  policy:
    overrideRules:
      - clusterSelector:
          clusterSelectorTerms:
            - labelSelector:
                matchExpressions: []
        jsonPatchOverrides:
          - op: remove
            path: /spec/suspend