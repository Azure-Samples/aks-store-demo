name: package-store-admin

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "src/store-admin/**"
  push:
    branches:
      - "main"
    paths:
      - "src/store-admin/**"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-container-image:
    runs-on: ubuntu-latest

    steps:
      - name: Set environment variables
        id: set-variables
        run: |
          echo "REPOSITORY=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "IMAGE=store-admin" >> "$GITHUB_OUTPUT"
          echo "VERSION=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "CREATED=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Env variable output
        id: test-variables
        run: |
          echo ${{ steps.set-variables.outputs.REPOSITORY }}
          echo ${{ steps.set-variables.outputs.IMAGE }}
          echo ${{ steps.set-variables.outputs.VERSION }}
          echo ${{ steps.set-variables.outputs.CREATED }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/store-admin/package-lock.json

      - name: Install test dependencies
        run: npm ci --no-audit --no-fund
        working-directory: src/store-admin

      - name: Run unit tests
        run: npm run test:unit -- --run
        working-directory: src/store-admin

      - name: Run linters
        run: npx --no-install oxlint . -D correctness --ignore-path .gitignore && npx --no-install eslint .
        working-directory: src/store-admin

      - name: Run production build
        run: npm run build
        working-directory: src/store-admin

      - name: Smoke test development server
        working-directory: src/store-admin
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { createServer } from 'vite'
          const server = await createServer({
            server: { host: '127.0.0.1', port: 0, strictPort: false, open: false },
          })
          try {
            await server.listen()
            const address = server.httpServer.address()
            assert(address && typeof address === 'object')
            for (const path of ['/health', '/', '/src/main.ts', '/src/components/TopNav.vue']) {
              const response = await fetch(`http://127.0.0.1:${address.port}${path}`)
              assert.equal(response.status, 200, path)
              if (path === '/health') assert.equal((await response.json()).status, 'ok')
              else assert.ok((await response.text()).length > 0)
              console.log(`PASS ${path}`)
            }
          } finally {
            await server.close()
          }
          JS

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/store-admin
          file: src/store-admin/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.set-variables.outputs.REPOSITORY }}/${{ steps.set-variables.outputs.IMAGE }}:latest
            ${{ steps.set-variables.outputs.REPOSITORY }}/${{ steps.set-variables.outputs.IMAGE }}:${{ steps.set-variables.outputs.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.created=${{ steps.set-variables.outputs.CREATED }}
            org.opencontainers.image.revision=${{ steps.set-variables.outputs.VERSION }}
