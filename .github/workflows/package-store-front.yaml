name: package-store-front

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "src/store-front/**"
  push:
    branches:
      - "main"
    paths:
      - "src/store-front/**"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-container-image:
    runs-on: ubuntu-latest

    steps:
      - name: Set environment variables
        id: set-variables
        run: |
          echo "REPOSITORY=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "IMAGE=store-front" >> "$GITHUB_OUTPUT"
          echo "VERSION=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "CREATED=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Env variable output
        id: test-variables
        run: |
          echo ${{ steps.set-variables.outputs.REPOSITORY }}
          echo ${{ steps.set-variables.outputs.IMAGE }}
          echo ${{ steps.set-variables.outputs.VERSION }}
          echo ${{ steps.set-variables.outputs.CREATED }}

      - name: Checkout code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/store-front/package-lock.json

      - name: Install test dependencies
        run: npm ci --no-audit --no-fund
        working-directory: src/store-front

      - name: Run unit tests
        run: npm run test:unit -- --run
        working-directory: src/store-front

      - name: Run linters
        run: npx --no-install oxlint . -D correctness --ignore-path .gitignore && npx --no-install eslint .
        working-directory: src/store-front

      - name: Smoke test development server
        working-directory: src/store-front
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { createServer } from 'vite'
          const server = await createServer({
            server: { host: '127.0.0.1', port: 0, strictPort: false, open: false },
          })
          try {
            await server.listen()
            const address = server.httpServer.address()
            assert(address && typeof address === 'object')
            for (const path of ['/health', '/', '/src/main.ts', '/src/components/TopNav.vue']) {
              const response = await fetch(`http://127.0.0.1:${address.port}${path}`)
              assert.equal(response.status, 200, path)
              if (path === '/health') assert.equal((await response.json()).status, 'ok')
              else assert.ok((await response.text()).length > 0)
              console.log(`PASS ${path}`)
            }
          } finally {
            await server.close()
          }
          JS

      - name: Install Chromium for smoke tests
        run: npx --no-install playwright install --with-deps chromium --only-shell
        working-directory: src/store-front

      - name: Run browser smoke test
        run: npm run build && npm run test:e2e -- --project=chromium --reporter=line
        working-directory: src/store-front
        env:
          CI: "true"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dd4fa0671be5250ee6f50aedf4cb05514abda2c7 # v1.14.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@ac9327eae2b366085ac7f6a2d02df8aa8ead720a # v2.10.0
        with:
          context: src/store-front
          file: src/store-front/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.set-variables.outputs.REPOSITORY }}/${{ steps.set-variables.outputs.IMAGE }}:latest
            ${{ steps.set-variables.outputs.REPOSITORY }}/${{ steps.set-variables.outputs.IMAGE }}:${{ steps.set-variables.outputs.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.created=${{ steps.set-variables.outputs.CREATED }}
            org.opencontainers.image.revision=${{ steps.set-variables.outputs.VERSION }}
